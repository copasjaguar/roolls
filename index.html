<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Roleta</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #2c2c2c;
      font-family: Arial, sans-serif;
    }

    /* 🔹 Cabeçalho flutuando */
    header {
      width: 100%;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-sizing: border-box;
      position: fixed; /* fica por cima */
      top: 0;
      left: 0;
      z-index: 10000; /* garante que fica sobre o canvas */
    }

    header img {
      height: 60%;
      max-height: 70px;
      object-fit: contain;
    }

    /* 🔹 O canvas sempre ocupa a tela toda */
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      header {
        height: 70px;
      }
      header img {
        max-height: 50px;
      }
    }
  </style>
  <script src="js/phaser.js"></script>
</head>
<body>

  <!-- Cabeçalho fixo sobreposto -->
  <header>
    <img src="./contato/png/logo.png" alt="Logo">
  </header>

  <!-- Scripts do jogo -->
  <script src="js/wheel_config_8underwater.js"></script>
  <script src="js/animCoins.js"></script>
  <script src="js/wheelGame.js"></script>

</body>
</html>
